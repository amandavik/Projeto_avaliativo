<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro</title>
    <link rel="stylesheet"
    href="style2.css">
</head>

<body>

    <header>
        <h1>Portal Candidato - ENEM</h1>
    </header>

    <div class="container">

        <h2>Cadastro</h2>

        <input type="text" placeholder="Nome Completo">

        <input type="email" id="emailCad" placeholder="Email">
        <p id="erroEmailCad" class="erro"></p>

        <input type="tel" placeholder="Telefone">

        <input type="text" placeholder="Nome da Mãe">

        <input type="text" placeholder="Nome do Pai">

        <input type="text" placeholder="Endereço">

        <input type="text" placeholder="Número">

        <input type="text" placeholder="Cidade">

        <input type="text" placeholder="Estado">

        <input type="text" placeholder="País">

        <select>
            <option>Já concluí</option>
            <option>Estou cursando</option>
        </select>

        <select>
            <option>Pública</option>
            <option>Privada</option>
        </select>

        <input type="password" id="senhaCad" placeholder="Senha">
        <p id="erroSenhaCad" class="erro"></p>

        <input type="password" id="confirmar" placeholder="Confirmar Senha">
        <p id="erroConfirmar" class="erro"></p>

        <button type="button" onclick="salvar()">Salvar Inscrição</button>
        <button type="button" onclick="voltar()">Voltar</button>

    </div>

    <footer>
        <p> Amanda Souza-2026 ENEM</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
