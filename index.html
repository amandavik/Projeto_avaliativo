<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Portal do Candidato - ENEM</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Portal do Candidato - ENEM</h1>
    </header>

    <div class="container">

        <h2>Login</h2>

        <input type="email" id="email" placeholder="Digite seu e-mail">
        <p id="erroEmail" class="erro"></p>

        <input type="password" id="senha" placeholder="Digite sua senha">
        <p id="erroSenha" class="erro"></p>

        <button type="button" onclick="entrar()">Entrar</button>

        <button type="button" onclick="cadastro()">Cadastrar Novo Usuário</button>

    </div>

    <footer>
        Amanda Souza - 2026 ENEM
    </footer>

    <script src="script.js"></script>

</body>

</html>
